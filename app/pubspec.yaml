name: EVRYLUX
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.3

# ============================================================
# DEPENDENCIES
# ============================================================

dependencies:
  flutter:
    sdk: flutter

  # ==========================================================
  # FLUTTER LOCALIZATION
  # ==========================================================
  #
  # Necessário para os textos automáticos do Flutter em pt-BR:
  # Back -> Voltar
  # Close -> Fechar
  # Cancel -> Cancelar
  #
  # ==========================================================

  flutter_localizations:
    sdk: flutter

  # ==========================================================
  # UI
  # ==========================================================

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  flutter_markdown: ^0.7.7+1

  # ==========================================================
  # DESKTOP / WINDOWS
  # ==========================================================

  desktop_multi_window: ^0.3.0

  window_manager:
    git:
      url: https://github.com/boyan01/window_manager.git
      path: packages/window_manager
      ref: 6fae92d21b4c80ce1b8f71c1190d7970cf722bd4

  # ==========================================================
  # STORAGE / FILES
  # ==========================================================

  shared_preferences: ^2.5.3
  flutter_secure_storage: ^11.0.0
  path_provider: ^2.1.5
  path: ^1.9.1
  file_picker: ^12.1.3
  sqlite3: ^2.9.4

  # ==========================================================
  # NETWORK / BACKEND
  # ==========================================================

  http: ^1.2.2
  connectivity_plus: ^7.0.0
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.1

  # ==========================================================
  # SECURITY / CRYPTOGRAPHY
  # ==========================================================

  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4

  # ==========================================================
  # UTILITIES
  # ==========================================================

  uuid: ^4.5.1
  flutter_dotenv: ^6.0.1

# ============================================================
# DEVELOPMENT
# ============================================================

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# ============================================================
# FLUTTER
# ============================================================

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/body_map/
    - assets/images/branding/
