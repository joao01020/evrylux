[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    
    ; Pinos do Display
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    
    ; --- AJUSTES DE COR ---
    ; Se as cores continuarem estranhas, tente trocar BGR por RGB
    -D TFT_RGB_ORDER=TFT_RGB  
    ; Se o fundo branco estiver preto ou vice-versa, altere para INVERSION_OFF
    -D TFT_INVERSION_OFF=1    
    
    -D SPI_FREQUENCY=27000000
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    
    ; Fontes
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    
    ; Touch
    -D TOUCH_CS=33
    -D TOUCH_IRQ=36
    -D SPI_TOUCH_FREQUENCY=2500000

     ; --- SPI SEPARADO PARA O CYD ---
    -D TOUCH_USE_SET_SPI_FREQUENCY=1
    -D TOUCH_MISO=39
    -D TOUCH_MOSI=32
    -D TOUCH_SCLK=25

    ; MicroSD
    -D SD_CS=5
    -D SD_MISO=19
    -D SD_MOSI=23
    -D SD_SCLK=18

    